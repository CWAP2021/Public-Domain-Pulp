<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Publisher editor — Public Domain Pulp</title><style>body{font:18px/1.6 system-ui;background:#f4f1ea;color:#1a1a1a;margin:40px auto;max-width:780px;padding:20px}a{color:#8d2328}</style></head><body><main id="editor-message"><h1>Publisher editor</h1><p>The editor connects to the local content workspace. For remote editing, connect the publisher’s GitHub repository and authentication service first.</p><p><a href="/">Return to the website</a></p></main><script>window.CMS_MANUAL_INIT=true;if(['localhost','127.0.0.1'].includes(location.hostname)){const script=document.createElement('script');script.src='https://unpkg.com/decap-cms@3.17.1/dist/decap-cms.js';script.onload=async()=>{try{const config=await fetch('/admin/config.json').then(r=>r.json());document.getElementById('editor-message').remove();CMS.init({config});}catch(error){document.getElementById('editor-message')?.insertAdjacentHTML('beforeend','<p>Could not open the editor. Start the local CMS service and reload.</p>');}};document.body.append(script);}</script></body></html>
