[build]
  command = "pnpm build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "24"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
[[redirects]]
  from = "/my-blue-heaven"
  to = "/books/my-blue-heaven/"
  status = 301
